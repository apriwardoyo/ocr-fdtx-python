<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #fff;
            padding: 24px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        h2 { text-align: center; }
        #preview { width: 100%; margin-top: 10px; display: none; }
        textarea { width: 100%; height: 150px; margin-top: 15px; }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #125a9c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Applikasi OCR AW</h2>
    <p>Convert gambar ke tulisan</p>
    <input type="file" id="imageInput" accept="image/*" />
    <img id="preview" />

    <button onclick="uploadImage()">Tekan untuk process OCR</button>

    <textarea id="result" placeholder="Hasil OCR akan muncul di sini..."></textarea>
</div>

<script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    input.addEventListener("change", function () {
        const file = this.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        }
    });

    function uploadImage() {
        const file = input.files[0];
        if (!file) {
            alert("Pilih gambar terlebih dahulu!");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        fetch("/ocr", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("result").value = data.text || data.error;
        })
        .catch(err => {
            document.getElementById("result").value = "Error: " + err;
        });
    }
</script>

</body>
</html>
